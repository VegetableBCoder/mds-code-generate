# 集成测试用：真实 MySQL（本机 MariaDB 11.8，端口 3306）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/codegen_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    # 口令来自环境变量 DB_PASSWORD（不写进仓库）；未设置时 Spring 启动即报错
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis:
  configuration:
    map-underscore-to-camel-case: true